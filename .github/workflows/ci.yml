name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Coq, OCaml, dune
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq coq ocaml-nox ocaml-findlib ocaml-dune

      - name: make verify
        run: make verify
